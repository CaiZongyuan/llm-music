name: Runtime Doctor CLI

on:
  push:
    paths:
      - runtime/comfyui/**
      - .github/workflows/runtime-doctor.yml
  pull_request:
    paths:
      - runtime/comfyui/**
      - .github/workflows/runtime-doctor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor-cli:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
          architecture: x64
      - name: Check public CLI behavior without GPU dependencies
        run: python -m unittest discover -s runtime/comfyui/tests -v
