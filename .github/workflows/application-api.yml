name: Application API

on:
  push:
    paths:
      - services/api/**
      - workflows/**
      - runtime/comfyui/runtime.json
      - runtime/comfyui/models.json
      - runtime/comfyui/workflows/**
      - .github/workflows/application-api.yml
  pull_request:
    paths:
      - services/api/**
      - workflows/**
      - runtime/comfyui/runtime.json
      - runtime/comfyui/models.json
      - runtime/comfyui/workflows/**
      - .github/workflows/application-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: windows-latest
    # Cold install took 5m53s; the expanded 245-case CPU suite took 10m57s locally.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The upgrade regression runs immutable pre-dispatch-marker API source.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.28'
          enable-cache: false
      - name: Install independent CPU application environment
        run: uv sync --project services/api --locked --python 3.12.13
      - name: Check types
        run: uv run --project services/api --no-sync mypy --config-file services/api/pyproject.toml services/api/src/music_api
      - name: Verify public HTTP, storage failures and actual process restart
        run: uv run --project services/api --no-sync python -m pytest services/api/tests -q --basetemp "${{ runner.temp }}/application-api-cpu-evidence"
      - name: Export Pydantic OpenAPI without starting Runtime
        run: uv run --project services/api --no-sync music-api openapi --output api-openapi.json
      - name: Retain failed synthetic CPU fixtures and phase evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-cpu-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-api-cpu-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
