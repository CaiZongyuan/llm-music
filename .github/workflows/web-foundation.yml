name: Web workbench

on:
  push:
    paths:
      - apps/web/**
      - packages/api-client/**
      - tests/browser/**
      - tests/launcher/**
      - scripts/**
      - services/api/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - docs/guides/web-*
      - .github/workflows/web-foundation.yml
  pull_request:
    paths:
      - apps/web/**
      - packages/api-client/**
      - tests/browser/**
      - tests/launcher/**
      - scripts/**
      - services/api/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - docs/guides/web-*
      - .github/workflows/web-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.28'
          enable-cache: false
      - name: Install locked JS and independent CPU application environment
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --locked --python 3.12.13
      - name: Install Chromium
        run: pnpm test:browser:install
      - name: Check generated contracts, strict Web types and production build
        run: |
          pnpm client:check
          pnpm web:check
          pnpm test:browser:check
      - name: Exercise bilingual themes and persistent Project/Asset/Job consumers
        run: pnpm test:web
      - name: Exercise owned launcher startup, reuse, failures and bounded stop
        run: pnpm test:launcher
      - name: Exercise authoritative Jobs, cancellation and acknowledgement recovery
        run: pnpm test:web:jobs
      - name: Exercise transcription readiness, failure and explicit retry
        run: pnpm test:web:transcription
      - name: Exercise generation failure, durable save and damaged media recovery
        run: pnpm test:web:generation -- generation-recovery.controlled.ts
      - name: Exercise Runtime observations, model states and read-only settings recovery
        run: pnpm test:web:runtime
      - name: Restore both creator journeys and persisted entities after an API process restart
        run: pnpm test:web:gate
      - name: Bound failed shutdown and retain owned-child cleanup receipts
        run: pnpm test:web:gate:shutdown
      - name: Retain browser results and process ownership receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/browser/test-results/
            tests/browser/playwright-report/
            tests/browser/runtime-results/
            tests/browser/runtime-report/
            tests/browser/.artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
