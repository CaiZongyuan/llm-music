name: Documentation foundation

on:
  push:
    paths:
      - apps/docs/**
      - docs/learn/**
      - docs/guides/**
      - docs/reference/**
      - services/api/**
      - packages/api-client/**
      - docs/site.json
      - docs/guides/documentation*
      - runtime/comfyui/examples/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/documentation.yml
  pull_request:
    paths:
      - apps/docs/**
      - docs/learn/**
      - docs/guides/**
      - docs/reference/**
      - services/api/**
      - packages/api-client/**
      - docs/site.json
      - docs/guides/documentation*
      - runtime/comfyui/examples/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/documentation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.28'
          python-version: '3.12.13'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/api --locked --python 3.12.13
      - name: Validate sources, example recovery, and Astro types without GPU
        run: pnpm docs:check
      - name: Build and check links, anchors, assets, and Pages base
        run: pnpm docs:build
      - name: Preserve checked local artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/docs/dist/
          retention-days: 7
