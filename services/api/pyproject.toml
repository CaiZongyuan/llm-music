[project]
name = "llm-music-api"
version = "0.1.0"
description = "Local Project and Asset application API, independent of GPU Runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
music-api = "music_api.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "mypy>=1.15,<2", "pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
