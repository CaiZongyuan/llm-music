<!doctype html>
<html lang="zh-Hans" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="音乐工作台文档的独立交互预览。" />
    <title>音乐工作台 · 文档预览</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <a class="brand" href="#/zh/overview" aria-label="音乐工作台文档首页">
        <span class="brand-mark" aria-hidden="true">♫</span>
        <span><strong id="brand-name">音乐工作台</strong><span id="brand-docs">文档</span></span>
      </a>
      <button class="search-trigger" id="search-open"><span aria-hidden="true">⌕</span><span id="search-label">搜索文档</span><kbd>Ctrl K</kbd></button>
      <div class="header-settings">
        <label class="sr-only" for="theme">主题</label>
        <select id="theme" aria-label="主题"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select>
        <span class="header-divider" aria-hidden="true"></span>
        <label class="sr-only" for="language">语言</label>
        <select id="language" aria-label="语言"><option value="zh">简体中文</option><option value="en">English</option></select>
        <a class="repo-link" href="https://github.com/CaiZongyuan/llm-music" target="_blank" rel="noreferrer">GitHub ↗</a>
      </div>
    </header>
    <aside class="sidebar" aria-label="文档导航">
      <div class="preview-notice"><span class="status-dot"></span><span id="preview-label">独立文档预览</span><small id="preview-isolation">不会连接 Runtime</small></div>
      <nav id="navigation"></nav>
      <details class="preview-tools" id="preview-tools">
        <summary id="preview-tools-label">预览搜索状态</summary>
        <p id="preview-tools-note">只改变此预览的搜索体验。</p>
        <button data-search-state="loading" id="preview-loading">加载中</button>
        <button data-search-state="failed" id="preview-failed">加载失败</button>
        <button data-search-state="ready" id="preview-ready">正常</button>
      </details>
      <div class="sidebar-footer"><span>PREVIEW v2</span><a id="sidebar-source" href="https://github.com/CaiZongyuan/llm-music/tree/f02bd5310ea29845f1900a53271e71df30f5169b" target="_blank" rel="noreferrer">f02bd53 ↗</a></div>
    </aside>
    <main id="main" tabindex="-1"><div class="page-state" role="status">正在载入文档…</div></main>
    <aside class="page-outline" aria-label="本页内容"><div id="outline"></div></aside>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <div class="search-heading"><h2 id="search-title">搜索文档</h2><button id="search-close" aria-label="关闭搜索">Esc</button></div>
      <label class="sr-only" for="search-input" id="search-input-label">搜索关键词</label>
      <input id="search-input" type="search" placeholder="搜索 Runtime、模型、MIDI…" autocomplete="off" />
      <div id="search-results" aria-live="polite"></div>
      <div class="search-footer" id="search-footer">搜索此版本的文档</div>
    </dialog>
    <div id="copy-status" class="toast" role="status"></div>
  </body>
</html>
